<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 215" width="210" height="215">
  <defs>
    <!-- Gradiente plano cartoon para tablones -->
    <linearGradient id="pg" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%"   stop-color="#5C2A08"/>
      <stop offset="28%"  stop-color="#9A5225"/>
      <stop offset="72%"  stop-color="#8B4618"/>
      <stop offset="100%" stop-color="#5C2A08"/>
    </linearGradient>
    <!-- Gradiente más oscuro para el letrero -->
    <linearGradient id="sg" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%"   stop-color="#3A1604"/>
      <stop offset="28%"  stop-color="#6E3210"/>
      <stop offset="72%"  stop-color="#5C2A08"/>
      <stop offset="100%" stop-color="#3A1604"/>
    </linearGradient>
    <!-- Brillo del clavo -->
    <radialGradient id="ng" cx="33%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#D8D8D8"/>
      <stop offset="60%"  stop-color="#888"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </radialGradient>
  </defs>

  <!-- ══ TABLÓN IZQUIERDO: inclinado -7° (detrás del centro) ══ -->
  <g transform="rotate(-7, 44, 104)">
    <rect x="20" y="13" width="48" height="182" rx="9" ry="7"
          fill="url(#pg)" stroke="#1A0800" stroke-width="3.5"/>
    <!-- veta de madera -->
    <line x1="33" y1="15" x2="31" y2="193" stroke="#1A0800" stroke-width="1.1" opacity="0.3"/>
    <line x1="49" y1="15" x2="51" y2="193" stroke="#C07030" stroke-width="0.7" opacity="0.18"/>
    <!-- nudo -->
    <ellipse cx="42" cy="150" rx="5" ry="7" fill="none"
             stroke="#1A0800" stroke-width="1.2" opacity="0.38"/>
  </g>

  <!-- ══ TABLÓN DERECHO: inclinado +6° (detrás del centro) ══ -->
  <g transform="rotate(6, 166, 103)">
    <rect x="142" y="15" width="48" height="177" rx="9" ry="7"
          fill="url(#pg)" stroke="#1A0800" stroke-width="3.5"/>
    <line x1="155" y1="17" x2="153" y2="190" stroke="#1A0800" stroke-width="1.1" opacity="0.3"/>
    <line x1="171" y1="17" x2="173" y2="190" stroke="#C07030" stroke-width="0.7" opacity="0.18"/>
  </g>

  <!-- ══ TABLÓN CENTRAL: +2°, MÁS ALTO, ENCIMA de los otros ══ -->
  <g transform="rotate(2, 105, 106)">
    <rect x="81" y="6" width="48" height="200" rx="9" ry="7"
          fill="url(#pg)" stroke="#1A0800" stroke-width="3.5"/>
    <line x1="93"  y1="8"  x2="91"  y2="204" stroke="#1A0800" stroke-width="1.1" opacity="0.3"/>
    <line x1="109" y1="8"  x2="111" y2="204" stroke="#C07030" stroke-width="0.7" opacity="0.18"/>
    <!-- nudo doble -->
    <ellipse cx="105" cy="168" rx="5.5" ry="8"   fill="none"
             stroke="#1A0800" stroke-width="1.3" opacity="0.4"/>
    <ellipse cx="105" cy="168" rx="2.5" ry="4.5" fill="none"
             stroke="#1A0800" stroke-width="0.7" opacity="0.25"/>
  </g>

  <!-- ══ LETRERO HORIZONTAL: más alto para caber ambos textos ══ -->
  <polygon points="2,88  207,81  210,154  3,160"
           fill="url(#sg)" stroke="#1A0800" stroke-width="3.5"
           stroke-linejoin="round"/>
  <!-- vetas del letrero -->
  <line x1="4"  y1="100" x2="208" y2="94"  stroke="#1A0800" stroke-width="0.7" opacity="0.2"/>
  <line x1="4"  y1="122" x2="208" y2="116" stroke="#1A0800" stroke-width="0.5" opacity="0.15"/>
  <line x1="4"  y1="148" x2="208" y2="142" stroke="#1A0800" stroke-width="0.6" opacity="0.18"/>

  <!-- ══ CLAVOS (4 esquinas del letrero) ══ -->
  <!-- sup-izq -->
  <circle cx="30"  cy="93"  r="6.5" fill="url(#ng)" stroke="#1E1E1E" stroke-width="1.3"/>
  <circle cx="30"  cy="93"  r="2.2" fill="#E8E8E8"/>
  <!-- sup-der -->
  <circle cx="181" cy="87"  r="6.5" fill="url(#ng)" stroke="#1E1E1E" stroke-width="1.3"/>
  <circle cx="181" cy="87"  r="2.2" fill="#E8E8E8"/>
  <!-- inf-izq -->
  <circle cx="29"  cy="154" r="6.5" fill="url(#ng)" stroke="#1E1E1E" stroke-width="1.3"/>
  <circle cx="29"  cy="154" r="2.2" fill="#E8E8E8"/>
  <!-- inf-der -->
  <circle cx="182" cy="149" r="6.5" fill="url(#ng)" stroke="#1E1E1E" stroke-width="1.3"/>
  <circle cx="182" cy="149" r="2.2" fill="#E8E8E8"/>

  <!-- ══ Ambos textos con el mismo ángulo del letrero ══ -->
  <g transform="rotate(-2.5, 106, 120)">
    <!-- "Tablitas" — grande, crema -->
    <text x="106" y="117"
          text-anchor="middle"
          font-family="'Arial Black', 'Arial', sans-serif"
          font-size="36" font-weight="900"
          fill="#FFF2CC"
          stroke="#1A0800" stroke-width="4.5"
          paint-order="stroke fill">
      Tablitas
    </text>
    <!-- "QUINIELAS" — pequeño, ámbar, justo debajo -->
    <text x="106" y="139"
          text-anchor="middle"
          font-family="'Arial', Helvetica, sans-serif"
          font-size="11" font-weight="700"
          fill="#F0A830"
          stroke="#1A0800" stroke-width="1.8"
          paint-order="stroke fill"
          letter-spacing="5">
      QUINIELAS
    </text>
  </g>
</svg>
