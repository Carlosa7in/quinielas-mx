<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" width="200" height="215">
  <defs>
    <!-- Gradiente lateral para tablones (oscuro en bordes, más claro al centro) -->
    <linearGradient id="plank-g" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%"   stop-color="#200A02"/>
      <stop offset="18%"  stop-color="#7A4020"/>
      <stop offset="48%"  stop-color="#9A5228"/>
      <stop offset="82%"  stop-color="#7A4020"/>
      <stop offset="100%" stop-color="#200A02"/>
    </linearGradient>

    <!-- Gradiente tablón horizontal (letrero) — café más oscuro -->
    <linearGradient id="sign-g" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%"   stop-color="#200A02"/>
      <stop offset="16%"  stop-color="#5E2E10"/>
      <stop offset="50%"  stop-color="#7A3C18"/>
      <stop offset="84%"  stop-color="#5E2E10"/>
      <stop offset="100%" stop-color="#200A02"/>
    </linearGradient>

    <!-- Brillo del clavo -->
    <radialGradient id="nail-g" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#D0D0D0"/>
      <stop offset="55%"  stop-color="#888"/>
      <stop offset="100%" stop-color="#3A3A3A"/>
    </radialGradient>

    <!-- Sombra sutil -->
    <filter id="shadow" x="-5%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ TABLONES VERTICALES ══════════ -->

  <!-- Tablón izquierdo -->
  <rect x="24" y="20" width="46" height="174" rx="4"
        fill="url(#plank-g)" stroke="#150601" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- veta de madera -->
  <line x1="36" y1="20" x2="34" y2="194" stroke="#150601" stroke-width="0.9" opacity="0.38"/>
  <line x1="52" y1="20" x2="54" y2="194" stroke="#C07040" stroke-width="0.6" opacity="0.18"/>
  <line x1="62" y1="20" x2="60" y2="194" stroke="#150601" stroke-width="0.5" opacity="0.2"/>

  <!-- Tablón central (un poco más alto) -->
  <rect x="76" y="10" width="46" height="194" rx="4"
        fill="url(#plank-g)" stroke="#150601" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="88" y1="10" x2="86" y2="204" stroke="#150601" stroke-width="0.9" opacity="0.38"/>
  <line x1="103" y1="10" x2="105" y2="204" stroke="#C07040" stroke-width="0.6" opacity="0.18"/>
  <!-- nudo de madera -->
  <ellipse cx="99" cy="168" rx="5" ry="8" fill="none" stroke="#150601" stroke-width="1.2" opacity="0.42"/>
  <ellipse cx="99" cy="168" rx="2.5" ry="4.5" fill="none" stroke="#150601" stroke-width="0.7" opacity="0.25"/>

  <!-- Tablón derecho -->
  <rect x="128" y="20" width="46" height="174" rx="4"
        fill="url(#plank-g)" stroke="#150601" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="140" y1="20" x2="138" y2="194" stroke="#150601" stroke-width="0.9" opacity="0.38"/>
  <line x1="156" y1="20" x2="158" y2="194" stroke="#C07040" stroke-width="0.6" opacity="0.18"/>
  <line x1="166" y1="20" x2="164" y2="194" stroke="#150601" stroke-width="0.5" opacity="0.2"/>

  <!-- ══════════ LETRERO HORIZONTAL ══════════ -->
  <rect x="6" y="82" width="188" height="56" rx="5"
        fill="url(#sign-g)" stroke="#150601" stroke-width="2.2" filter="url(#shadow)"/>
  <!-- vetas del letrero -->
  <line x1="6" y1="92"  x2="194" y2="91"  stroke="#150601" stroke-width="0.6" opacity="0.28"/>
  <line x1="6" y1="111" x2="194" y2="112" stroke="#150601" stroke-width="0.5" opacity="0.2"/>
  <line x1="6" y1="130" x2="194" y2="129" stroke="#150601" stroke-width="0.6" opacity="0.28"/>

  <!-- ══════════ CLAVOS (4 esquinas del letrero) ══════════ -->
  <!-- sup-izq → sobre el tablón izquierdo -->
  <circle cx="31"  cy="89"  r="5.5" fill="url(#nail-g)" stroke="#2A2A2A" stroke-width="0.9"/>
  <circle cx="31"  cy="89"  r="1.8" fill="#E0E0E0"/>
  <!-- sup-der → sobre el tablón derecho -->
  <circle cx="169" cy="89"  r="5.5" fill="url(#nail-g)" stroke="#2A2A2A" stroke-width="0.9"/>
  <circle cx="169" cy="89"  r="1.8" fill="#E0E0E0"/>
  <!-- inf-izq -->
  <circle cx="31"  cy="131" r="5.5" fill="url(#nail-g)" stroke="#2A2A2A" stroke-width="0.9"/>
  <circle cx="31"  cy="131" r="1.8" fill="#E0E0E0"/>
  <!-- inf-der -->
  <circle cx="169" cy="131" r="5.5" fill="url(#nail-g)" stroke="#2A2A2A" stroke-width="0.9"/>
  <circle cx="169" cy="131" r="1.8" fill="#E0E0E0"/>

  <!-- ══════════ TEXTO DEL LETRERO ══════════ -->
  <!-- "tablitas" — grande, crema con contorno oscuro -->
  <text x="100" y="116"
        text-anchor="middle"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="33" font-weight="900"
        fill="#FFF0CC"
        stroke="#150601" stroke-width="3.5"
        paint-order="stroke fill">
    tablitas
  </text>
  <!-- "quinielas" — más pequeño, ámbar dorado -->
  <text x="100" y="131"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11" font-weight="700"
        fill="#F0A830"
        stroke="#150601" stroke-width="1.5"
        paint-order="stroke fill"
        letter-spacing="4.5">
    quinielas
  </text>

  <!-- ══════════ BALÓN PEQUEÑO (arriba, entre tablones) ══════════ -->
  <circle cx="100" cy="14" r="9" fill="#FFFEF8" stroke="#222" stroke-width="1.2"/>
  <!-- parches del balón (hexágonos simplificados como manchas) -->
  <ellipse cx="100" cy="14" rx="4" ry="3.5" fill="#222" opacity="0.85"/>
  <ellipse cx="93"  cy="10" rx="2.5" ry="2"  fill="#222" opacity="0.7"  transform="rotate(-25 93 10)"/>
  <ellipse cx="107" cy="10" rx="2.5" ry="2"  fill="#222" opacity="0.7"  transform="rotate(25 107 10)"/>
  <ellipse cx="92"  cy="18" rx="2.5" ry="2"  fill="#222" opacity="0.6"  transform="rotate(20 92 18)"/>
  <ellipse cx="108" cy="18" rx="2.5" ry="2"  fill="#222" opacity="0.6"  transform="rotate(-20 108 18)"/>
</svg>
